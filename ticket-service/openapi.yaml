openapi: 3.0.3
info:
  title: Abidi Desk API
  version: 1.0.0
  license:
    name: Proprietary
  description: |
    Multi-tenant internal support desk API for Abidi Desk.

    Authentication uses an Azure Entra ID access token in the Authorization
    header. The API validates the token, resolves the tenant, and enforces
    record-level ticket scope. There is no password login endpoint; the SPA
    obtains tokens through MSAL using Authorization Code + PKCE.

    Errors use RFC 7807 Problem Details with an application-specific `code`
    and a `requestId`. List endpoints are paginated. Mutating POST endpoints
    accept an `Idempotency-Key`. PATCH endpoints accept `If-Match` with the
    ticket version.
servers:
  - url: https://tickets.abidipro.abidisolutions.com/api
    description: Production
  - url: http://localhost:4010/api
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Identity bootstrap and current-user context.
  - name: Tickets
    description: Ticket lifecycle, assignment, comments, and attachments.
  - name: Search
    description: Cross-ticket search.
  - name: Stats
    description: Dashboard and reporting aggregates.
  - name: Settings
    description: Tenant settings, categories, priorities, and SLA policies.
  - name: Directory
    description: Read-only user and agent lookup.
  - name: Audit
    description: Append-only audit trail.
  - name: Health
    description: Liveness and readiness.

paths:
  /v1/auth/config:
    get:
      tags: [Auth]
      summary: Public OIDC configuration for the SPA
      description: Returns non-secret MSAL configuration. No authentication required.
      security: []
      responses:
        '200':
          description: OIDC configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user, tenant, roles, and capabilities
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets:
    get:
      tags: [Tickets]
      summary: List, filter, and search tickets
      description: |
        Results are always scoped to the authenticated tenant and role. A
        requester sees only their own tickets. An agent sees assigned tickets
        and may use `view=unassigned` for the queue. An admin/viewer may use
        `view=all`.
      x-required-permission: ticket:read:own|ticket:read:assigned|ticket:read:queue|ticket:read:tenant
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AssigneeFilter'
        - $ref: '#/components/parameters/RequesterFilter'
        - $ref: '#/components/parameters/SlaStateFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/UpdatedFrom'
        - $ref: '#/components/parameters/UpdatedTo'
        - $ref: '#/components/parameters/IncludeDeleted'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Paginated ticket list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Tickets]
      summary: Create a ticket
      description: |
        Accepts JSON or multipart/form-data. Use multipart to include up to
        five attachments in the same request. Requester defaults to the current
        user; admins may create on behalf of another requester in the tenant.
      x-required-permission: ticket:create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketCreateMultipartRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/export:
    get:
      tags: [Tickets]
      summary: Export the current filtered ticket view as CSV
      x-required-permission: stats:export
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AssigneeFilter'
        - $ref: '#/components/parameters/RequesterFilter'
        - $ref: '#/components/parameters/SlaStateFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/bulk:
    post:
      tags: [Tickets]
      summary: Apply one action to up to 100 tickets
      description: |
        Partial success is possible. The response reports each failed ticket.
        Bulk delete is soft-delete. Bulk transition validates each ticket
        independently.
      x-required-permission: ticket:bulk
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkActionRequest'
      responses:
        '200':
          description: Bulk result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Get ticket detail
      x-required-permission: ticket:read:own|ticket:read:assigned|ticket:read:queue|ticket:read:tenant
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Tickets]
      summary: Update ticket content fields
      description: |
        Updates subject, description, category, priority, or tags. Status and
        assignment have dedicated command endpoints. Requires If-Match for
        optimistic concurrency.
      x-required-permission: ticket:update
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdateRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Tickets]
      summary: Soft-delete a ticket
      x-required-permission: ticket:delete
      responses:
        '204':
          description: Ticket soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/restore:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      summary: Restore a soft-deleted ticket
      x-required-permission: ticket:restore
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Restored ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/transitions:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      summary: Transition ticket status
      description: |
        Validates the transition against the state machine and caller scope.
        Writes status history, audit, and an outbox event. Reopening clears
        resolved/closed timestamps and increments reopenCount.
      x-required-permission: ticket:transition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTransitionRequest'
      responses:
        '200':
          description: Ticket after transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/assign:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      summary: Assign or reassign a ticket
      description: |
        Agents may self-assign an unassigned ticket. Admins may assign to any
        active agent in the tenant. Assignees outside the tenant or without an
        agent/admin role are rejected.
      x-required-permission: ticket:assign
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: Ticket after assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/unassign:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      summary: Remove the current assignee
      x-required-permission: ticket:unassign
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignRequest'
      responses:
        '200':
          description: Ticket after unassignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/assignments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Assignment history
      x-required-permission: ticket:read:own|ticket:read:assigned|ticket:read:queue|ticket:read:tenant
      responses:
        '200':
          description: Assignment history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/history:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Combined status, assignment, and audit history
      x-required-permission: ticket:read:own|ticket:read:assigned|ticket:read:queue|ticket:read:tenant
      responses:
        '200':
          description: Combined ticket history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/comments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: List comments
      description: Requesters receive public comments only. Agents/admins may request internal comments.
      x-required-permission: ticket:read:own|ticket:read:assigned|ticket:read:queue|ticket:read:tenant
      parameters:
        - name: visibility
          in: query
          schema:
            $ref: '#/components/schemas/CommentVisibility'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Tickets]
      summary: Add a public or internal comment
      description: |
        Accepts JSON or multipart/form-data. Multipart supports up to five
        attachments. Internal comments require comment:internal and are never
        visible to requesters.
      x-required-permission: comment:public|comment:internal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentCreateMultipartRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [Tickets]
      summary: Edit a comment
      description: Authors may edit within 15 minutes. Admins with comment:moderate may edit later.
      x-required-permission: comment:public|comment:internal|comment:moderate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdateRequest'
      responses:
        '200':
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Tickets]
      summary: Soft-delete a comment
      x-required-permission: comment:public|comment:internal|comment:moderate
      responses:
        '204':
          description: Comment soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/attachments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: List ticket attachments
      x-required-permission: ticket:read:own|ticket:read:assigned|ticket:read:queue|ticket:read:tenant
      responses:
        '200':
          description: Attachments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Tickets]
      summary: Upload ticket attachments
      description: Max 5 files, 25 MB each, 10 per ticket. Allowed MIME types are validated server-side.
      x-required-permission: attachment:upload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [attachments]
              properties:
                attachments:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Uploaded attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: File too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/AttachmentId'
    delete:
      tags: [Tickets]
      summary: Soft-delete an attachment
      x-required-permission: attachment:delete
      responses:
        '204':
          description: Attachment soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tickets/{ticketId}/attachments/{attachmentId}/download-url:
    parameters:
      - $ref: '#/components/parameters/TicketId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Tickets]
      summary: Get a short-lived download URL
      description: Returns a 5-minute SAS URL only when the attachment is clean and the caller can read the ticket.
      x-required-permission: attachment:download
      responses:
        '200':
          description: Short-lived download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDownload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Attachment is not yet clean
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/search:
    get:
      tags: [Search]
      summary: Search tickets and comments
      x-required-permission: ticket:read:own|ticket:read:assigned|ticket:read:queue|ticket:read:tenant
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 150
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/stats/overview:
    get:
      tags: [Stats]
      summary: Dashboard overview
      x-required-permission: stats:read
      parameters:
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/AssigneeFilter'
      responses:
        '200':
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/stats/timeseries:
    get:
      tags: [Stats]
      summary: Created, resolved, and backlog time series
      x-required-permission: stats:read
      parameters:
