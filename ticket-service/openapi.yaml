components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        description: Ticket ObjectId.
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        description: Comment ObjectId.
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        description: Attachment ObjectId.
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        description: Category ObjectId.
    PriorityId:
      name: priorityId
      in: path
      required: true
      schema:
        type: string
        description: Priority ObjectId.
    SlaPolicyId:
      name: slaPolicyId
      in: path
      required: true
      schema:
        type: string
        description: SLA policy ObjectId.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      name: sort
      in: query
      description: Comma-separated sort fields; prefix with - for descending.
      schema:
        type: string
        example: -createdAt
    View:
      name: view
      in: query
      schema:
        type: string
        enum: [my, assigned, unassigned, all]
        default: my
    StatusFilter:
      name: status
      in: query
      description: Comma-separated ticket statuses.
      schema:
        type: string
        example: new,open,in_progress
    PriorityFilter:
      name: priority
      in: query
      description: Comma-separated priority keys.
      schema:
        type: string
        example: high,urgent
    CategoryFilter:
      name: categoryId
      in: query
      schema:
        type: string
    AssigneeFilter:
      name: assigneeId
      in: query
      description: ObjectId, "me", or "unassigned".
      schema:
        type: string
    RequesterFilter:
      name: requesterId
      in: query
      description: ObjectId or "me".
      schema:
        type: string
    SlaStateFilter:
      name: slaState
      in: query
      schema:
        type: string
        example: on_track,at_risk
    TagFilter:
      name: tag
      in: query
      description: Comma-separated tags.
      schema:
        type: string
    Query:
      name: q
      in: query
      description: Search ticket number, subject, description, requester email/name.
      schema:
        type: string
        maxLength: 150
    CreatedFrom:
      name: createdFrom
      in: query
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: createdTo
      in: query
      schema:
        type: string
        format: date-time
    UpdatedFrom:
      name: updatedFrom
      in: query
      schema:
        type: string
        format: date-time
    UpdatedTo:
      name: updatedTo
      in: query
      schema:
        type: string
        format: date-time
    IncludeDeleted:
      name: includeDeleted
      in: query
      description: Admin only.
      schema:
        type: boolean
        default: false
    Include:
      name: include
      in: query
      description: Optional heavy fields.
      schema:
        type: string
        example: total,sla,commentCount
    IfMatch:
      name: If-Match
      in: header
      description: Ticket version from the last read, e.g. "3".
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique key for safe retries. Replays are stored for 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    StatsFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    StatsTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found in the tenant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version, state, or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://errors.abididesk.com/validation-error
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 422
        code:
          type: string
          example: VALIDATION_ERROR
        detail:
          type: string
        instance:
          type: string
          format: uri
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Role:
      type: string
      enum: [requester, agent, admin, viewer]

    TicketStatus:
      type: string
      enum: [new, open, in_progress, pending_requester, resolved, closed, cancelled]

    TicketSource:
      type: string
      enum: [web, api, migration, email]

    SlaState:
      type: string
      enum: [on_track, at_risk, breached, met, not_applicable]

    CommentVisibility:
      type: string
      enum: [public, internal]

    AttachmentScanStatus:
      type: string
      enum: [pending, clean, blocked, failed]

    AuthConfig:
      type: object
      required: [authority, clientId, apiScope]
      properties:
        authority:
          type: string
          format: uri
        clientId:
          type: string
        apiScope:
          type: string
        redirectUri:
          type: string
          format: uri
        tenantHint:
          type: string
          nullable: true

    UserSummary:
      type: object
      required: [id, displayName, email]
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          nullable: true

    TenantSummary:
      type: object
      required: [id, name, timezone]
      properties:
        id:
          type: string
        name:
          type: string
        timezone:
          type: string
          example: America/New_York

    Me:
      type: object
      required: [user, tenant, roles, capabilities]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        capabilities:
          type: array
          items:
            type: string
            example: ticket:create

    PriorityRef:
      type: object
      required: [id, key, label, rank]
      properties:
        id:
          type: string
        key:
          type: string
          enum: [urgent, high, normal, low]
        label:
          type: string
        rank:
          type: integer
        color:
          type: string
          nullable: true

    CategoryRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string

    SlaSummary:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/SlaState'
        firstResponseDueAt:
          type: string
          format: date-time
          nullable: true
        resolutionDueAt:
          type: string
          format: date-time
          nullable: true

    TicketSummary:
      type: object
      required:
        - id
        - number
        - subject
        - status
        - priority
